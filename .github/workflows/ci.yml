name: Parser CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned Kogwistar dependency
        uses: actions/checkout@v4
        with:
          repository: humblemat810/kogwistar
          ref: 78c897c
          path: kogwistar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install --upgrade poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install Ruff
        run: poetry run pip install ruff

      - name: Check changed provider style
        run: poetry run ruff check kg_doc_parser/workflow_ingest/providers.py

      - name: Run deterministic CI tests
        run: >-
          poetry run pytest -m "ci and not ci_full"
          -q --durations=25 --duration-min=0 -p no:cacheprovider
