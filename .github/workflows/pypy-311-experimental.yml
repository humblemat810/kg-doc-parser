name: Experimental PyPy 3.11 parser profile

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypy-311:
    name: PyPy 3.11 parser source probe
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/kogwistar
    steps:
      - name: Checkout parser
        uses: actions/checkout@v7

      - name: Checkout pinned Kogwistar source
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: 0a29bd1419dfd7eb31a136e7f149cb670314dee1
          path: kogwistar
          persist-credentials: false

      - name: Set up official PyPy 3.11
        uses: actions/setup-python@v7
        with:
          python-version: pypy-3.11-v7.3.20
          cache: pip

      - name: Verify interpreter and install bounded dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.implementation.name == "pypy"; assert sys.version_info[:2] == (3, 11); print(sys.implementation); print(sys.version)'
          python -m pip install -r requirements-pypy-3.11-experimental.txt

      - name: Run parser Python-authority tests
        shell: bash
        env:
          KOGWISTAR_IMPL_MODE: python
        run: >-
          python -m pytest
          tests/test_packaging_imports.py
          tests/test_workflow_ingest_contracts.py
          tests/test_workflow_ingest_conversation_graph.py
          tests/test_workflow_ingest_layerwise_parser.py
          tests/test_workflow_ingest_resolver_invariants.py
          -m "ci and not ci_full and not slow and not manual and not llm_real and not requires_ollama"
          -q --durations=25 --durations-min=0 -p no:cacheprovider

      - name: Report native boundary
        run: |
          echo "PyPy 3.11 parser source probe completed."
          echo "Native Kogwistar compatibility and application image publication remain separate gates."
