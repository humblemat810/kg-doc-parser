[pytest]
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
addopts = -p no:langsmith
testpaths = tests
markers =
    integration: marks tests as integration (deselect with -m "not integration")
    ci: marks tests intended for lightweight CI
    ci_full: marks tests intended for full backend/integration CI
    slow: marks tests that are intentionally excluded from default CI and run in full CI
    manual: marks tests intended for manual or interactive runs
    llm_real: marks tests that invoke a real model/provider; never part of contract CI
    requires_ollama: marks tests that require a local Ollama service/model
    legacy: legacy tests requiring external assets or historical import layout
    workflow: marks workflow-layer tests
[tool:pytest]
testpaths = tests
