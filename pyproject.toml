[tool.poetry]
name = "graph-knowledge-doc-parser"
version = "0.2.6"
description = "doc parser using llm driven engine with graph knowledge awareness"
authors = ["humblemat810 <67593116+humblemat810@users.noreply.github.com>"]
readme = "README.md"
packages = [
    { include = "kg_doc_parser" }
]
homepage = "https://github.com/humblemat810/kg_doc_parser"
repository = "https://github.com/humblemat810/kg_doc_parser"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: General",
]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.12.5"
joblib = { version = "^1.5.3", markers = "platform_python_implementation == 'CPython'" }
diskcache = { version = "^5.6", markers = "platform_python_implementation == 'PyPy'" }
pdf2image = "^1.17.0"
pypdf = "^6.5.0"
pathspec = "^0.12.1"
pikepdf = { version = "^10.1.0", markers = "platform_python_implementation != 'PyPy'" }
langchain-core = "^1.2.5"
langchain-google-genai = { version = "^4.1.2", optional = true }
langchain-openai = { version = "^1.6.7", optional = true }
langchain-google-vertexai = { version = "^3.2.4", optional = true }
pydantic-extension = "^0.0.7"
rapidfuzz = "^3.14.3"
mcp = "^2.2.0"
kogwistar = "0.6.4"

[tool.poetry.extras]
openai = ["langchain-openai"]
azure = ["langchain-openai"]
gemini = ["langchain-google-genai"]
vertex = ["langchain-google-vertexai"]
cloud = ["langchain-google-genai", "langchain-openai", "langchain-google-vertexai"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

[tool.poetry.scripts]
workflow-ingest = "kg_doc_parser.workflow_ingest.cli:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
