[package]
name = "kg-doc-parser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust semantic document parser MVP"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
sha1.workspace = true
rusqlite = { version = "0.37.0", features = ["bundled"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
png = "0.18.1"

[lib]
name = "kg_doc_parser"

[[bin]]
name = "kg-doc-parser"
path = "src/bin/cli.rs"

[dev-dependencies]
tempfile = "3.23"
